name: APK derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repodaki dosyalar
        run: find . -path ./.git -prune -o -type f -print | sort
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Derle
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -type f | head -1)")
          cd "$DIR"
          if [ ! -d app ]; then echo "HATA: app klasoru yok, yuklenmemis"; exit 1; fi
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RetroJet-apk
          path: '**/app-debug.apk'
